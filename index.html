<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự Kiện - Đếm Ngược</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="preload" href="background.jpg" as="image">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-container">
        <div class="content-wrapper">
            <div class="buttons-grid">
                <button class="main-button" data-number="1" aria-label="Button 1">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
                <button class="main-button" data-number="2" aria-label="Button 2">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
                <button class="main-button" data-number="3" aria-label="Button 3">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
                <button class="main-button" data-number="4" aria-label="Button 4">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
                <button class="main-button" data-number="5" aria-label="Button 5">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
                <button class="main-button" data-number="6" aria-label="Button 6">
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="radial-wave"></div>
                    <div class="light-sweep"></div>
                </button>
            </div>
            <div id="countdownDisplay" class="countdown-display hide">
                <span id="countdownNumber">5</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
