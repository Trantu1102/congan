<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a0505">
    <title>Sự Kiện - Đếm Ngược</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="preload" href="bg led.png" as="image">
    <link rel="preload" href="bg led_1.png" as="image">
    <link rel="preload" href="logo led.png" as="image">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="led-wrapper">
        <!-- Start overlay - click to enter fullscreen -->
        <div class="start-overlay" id="startOverlay">
            <div class="start-content">
                <div class="start-icon">🎉</div>
                <div class="start-text">Nhấn để bắt đầu</div>
                <div class="start-subtext">Click hoặc chạm vào màn hình</div>
            </div>
        </div>

        <!-- Particles Canvas for flying particle effects -->
        <canvas id="particlesCanvas"></canvas>

        <!-- Blur overlay for countdown -->
        <div id="blurOverlay" class="blur-overlay"></div>

        <!-- Countdown display - OUTSIDE background-container to avoid blur -->
        <div id="countdownDisplay" class="countdown-display hide">
            <span id="countdownNumber">5</span>
        </div>

        <!-- Background only -->
        <div class="background-container"></div>

        <!-- Buttons container - OUTSIDE background to avoid blur -->
        <div class="buttons-wrapper">
            <div class="buttons-container">
                <!-- Left group: buttons 1-3 -->
                <div class="buttons-group buttons-left">
                    <button class="main-button" data-number="1" aria-label="Button 1">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                    <button class="main-button" data-number="2" aria-label="Button 2">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                    <button class="main-button" data-number="3" aria-label="Button 3">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                </div>

                <!-- Gap divider between two groups -->
                <div class="buttons-gap"></div>

                <!-- Right group: buttons 4-6 -->
                <div class="buttons-group buttons-right">
                    <button class="main-button" data-number="4" aria-label="Button 4">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                    <button class="main-button" data-number="5" aria-label="Button 5">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                    <button class="main-button" data-number="6" aria-label="Button 6">
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="radial-wave"></div>
                        <div class="button-logo-shell"><img class="button-logo" src="logo led.png"
                                alt="Logo mắt đông đô">
                        </div>
                        <div class="light-sweep"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
